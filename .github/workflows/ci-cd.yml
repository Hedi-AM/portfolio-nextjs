name: ci-cd
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**', 'docker-compose.yml']
  workflow_dispatch:
    inputs:
      version:
        description: Image version tag (example v2)
        required: true
        default: v2
      evolve:
        description: Apply v2 evolution (yes/no)
        required: true
        default: 'no'
permissions:
  contents: write
env:
  IMAGE: portfolio-nextjs
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply evolution (v2 features)
        if: ${{ inputs.evolve == 'yes' }}
        run: |
          cp -r evolution/app/. app/
          git config user.name "backstage-pipeline"
          git config user.email "backstage-pipeline@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: evolution v2 (Certifications, DevOps and Cloud, Dark Mode, updated info)"
          git push origin main
      - name: Compute version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"
          elif [ "${{ github.run_number }}" = "1" ]; then V="v1"
          else V="v1.${{ github.run_number }}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}:latest
  deploy:
    needs: build
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: [self-hosted, portfolio-vm]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Deploy with docker compose
        run: TAG=${{ needs.build.outputs.version }} docker compose up -d --pull always
      - name: Health check
        run: |
          V=${{ needs.build.outputs.version }}
          ok=0
          for i in $(seq 1 30); do
            R=$(curl -fsS http://127.0.0.1:3005/api/health || true)
            if echo "$R" | grep -q "\"version\":\"$V\""; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then docker compose logs --tail 50; exit 1; fi
          echo "Healthy: $R"
