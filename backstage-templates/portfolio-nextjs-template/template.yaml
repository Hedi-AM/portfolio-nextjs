apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: portfolio-nextjs-template
  title: Portfolio Next.js (repo + Docker + CI/CD)
  description: Generates a Next.js portfolio, a GitHub repo, Docker artifacts and a CI/CD pipeline (build, push to Docker Hub, deploy on VM).
  tags: [nextjs, docker, portfolio]
spec:
  owner: user:default/guest
  type: website
  parameters:
    - title: Portfolio content
      required: [fullName, title, updatedTitle, email, bio, skills, certifications, devopsProjects]
      properties:
        fullName:
          title: Full name
          type: string
        title:
          title: Job title (v1)
          type: string
        updatedTitle:
          title: Updated job title (shown in v2)
          type: string
        email:
          title: Email
          type: string
        bio:
          title: Short bio
          type: string
          ui:widget: textarea
        skills:
          title: Skills (comma separated)
          type: string
        certifications:
          title: Certifications (comma separated, shown in v2)
          type: string
        devopsProjects:
          title: DevOps & Cloud projects (comma separated, shown in v2)
          type: string
    - title: Repository and Docker Hub
      required: [repoUrl, dockerhubUser, dockerhubToken]
      properties:
        repoUrl:
          title: GitHub repository
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts: [github.com]
        dockerhubUser:
          title: Docker Hub username
          type: string
          default: hediam
        dockerhubToken:
          title: Docker Hub access token
          type: string
          ui:field: Secret
  steps:
    - id: fetch
      name: Generate Next.js project and Docker artifacts
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutRender:
          - .github/workflows/*
          - .github/workflows/**
        values:
          fullName: ${{ parameters.fullName }}
          title: ${{ parameters.title }}
          updatedTitle: ${{ parameters.updatedTitle }}
          email: ${{ parameters.email }}
          bio: ${{ parameters.bio }}
          skills: ${{ parameters.skills }}
          certifications: ${{ parameters.certifications }}
          devopsProjects: ${{ parameters.devopsProjects }}
          dockerhubUser: ${{ parameters.dockerhubUser }}
          owner: ${{ (parameters.repoUrl | parseRepoUrl).owner }}
          repoName: ${{ (parameters.repoUrl | parseRepoUrl).repo }}
    - id: publish
      name: Create GitHub repository and set Docker Hub secrets
      action: publish:github
      input:
        repoUrl: ${{ parameters.repoUrl }}
        description: Portfolio Next.js generated by Backstage
        defaultBranch: main
        repoVisibility: public
        secrets:
          DOCKERHUB_USERNAME: ${{ parameters.dockerhubUser }}
          DOCKERHUB_TOKEN: ${{ secrets.dockerhubToken }}
    - id: register
      name: Register component in the catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
      - title: Pipeline runs (GitHub Actions)
        url: ${{ steps.publish.output.remoteUrl }}/actions
