name: portfolio-nextjs
services:
  web:
    image: hediam/portfolio-nextjs:${TAG:-v1}
    container_name: portfolio-nextjs
    ports:
      - "3005:3000"
    restart: unless-stopped
    environment:
      - APP_VERSION=${TAG:-v1}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
